apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: default
  namespace: argocd
spec:
  destination:
    namespace: argocd
    server: https://kubernetes.default.svc
  project: default
  source:
    directory:
      recurse: true
    path: infra/envs/default
    targetRevision: main
    repoURL: https://github.com/maxmurr/mercel
  syncPolicy: 
    automated:
      prune: true
      selfHeal: true 
    syncOptions:
      - CreateNamespace=true
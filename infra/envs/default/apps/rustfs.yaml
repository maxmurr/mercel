apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rustfs
  namespace: argocd
spec:
  destination:
    namespace: rustfs
    server: https://kubernetes.default.svc
  project: default
  source:
    repoURL: https://github.com/maxmurr/mercel
    targetRevision: main
    path: infra/workloads/rustfs
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

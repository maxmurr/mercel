apiVersion: v1
kind: Service
metadata:
  name: request-handler-server
spec:
  selector:
    app.kubernetes.io/name: request-handler-server
  ports:
    - name: http
      port: 3001
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: request-handler-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: request-handler-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: request-handler-server
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: request-handler-server
          image: mercel-request-handler:local
          imagePullPolicy: Never
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: mercel-runtime
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: mercel-runtime
                  key: AWS_SECRET_ACCESS_KEY
            - name: S3_ENDPOINT
              value: http://rustfs.rustfs.svc.cluster.local:9000
            - name: S3_BUCKET
              value: mercel
            - name: AWS_REGION
              value: us-east-1
            - name: PORT
              value: "3001"
          ports:
            - name: http
              containerPort: 3001
          # HTTP / needs a real deployment Host header and an existing S3 object.
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi

apiVersion: apps/v1
kind: Deployment
metadata:
  name: deploy-worker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: deploy-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: deploy-worker
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 660
      securityContext:
        fsGroup: 1000
      initContainers:
        # Native sidecar gates worker startup and stays alive while it drains jobs.
        - name: docker
          restartPolicy: Always
          image: docker:28.5.1-dind@sha256:ea9d20492ca1caaaba78e68453433895d256173c79281756e88b745647fcbcfd
          securityContext:
            privileged: true
            runAsUser: 0
            runAsGroup: 0
          args:
            - dockerd
            - --host=unix:///run/mercel-docker/docker.sock
            - --group=1000
          env:
            - name: DOCKER_HOST
              value: unix:///run/mercel-docker/docker.sock
            - name: DOCKER_TLS_CERTDIR
              value: ""
          startupProbe:
            exec:
              command: [docker, info]
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: [docker, info]
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
              ephemeral-storage: 1Gi
            limits:
              memory: 4Gi
              ephemeral-storage: 12Gi
          volumeMounts:
            - name: docker-socket
              mountPath: /run/mercel-docker
            - name: docker-data
              mountPath: /var/lib/docker
            - name: output
              # buildApp passes this absolute path to the daemon for bind mounts.
              mountPath: /app/apps/deploy-worker/output
      containers:
        - name: deploy-worker
          image: mercel-deploy-worker:local
          imagePullPolicy: Never
          workingDir: /app/apps/deploy-worker
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: mercel-runtime
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: mercel-runtime
                  key: REDIS_URL
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: mercel-runtime
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: mercel-runtime
                  key: AWS_SECRET_ACCESS_KEY
            - name: S3_ENDPOINT
              value: http://rustfs.rustfs.svc.cluster.local:9000
            - name: S3_BUCKET
              value: mercel
            - name: AWS_REGION
              value: us-east-1
            - name: DOCKER_HOST
              value: unix:///run/mercel-docker/docker.sock
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 1Gi
            limits:
              memory: 1Gi
              ephemeral-storage: 12Gi
          volumeMounts:
            - name: docker-socket
              mountPath: /run/mercel-docker
            - name: output
              mountPath: /app/apps/deploy-worker/output
      volumes:
        - name: docker-socket
          emptyDir: {}
        - name: docker-data
          emptyDir:
            sizeLimit: 10Gi
        - name: output
          emptyDir:
            sizeLimit: 10Gi

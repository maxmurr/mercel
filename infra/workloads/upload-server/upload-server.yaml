apiVersion: v1
kind: Service
metadata:
  name: upload-server
spec:
  selector:
    app.kubernetes.io/name: upload-server
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: upload-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: upload-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: upload-server
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: upload-server
          image: mercel-upload-server:local
          imagePullPolicy: Never
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: mercel-runtime
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: mercel-runtime
                  key: REDIS_URL
            - name: DEPLOY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mercel-runtime
                  key: DEPLOY_TOKEN
            - name: WORKBENCH_USER
              valueFrom:
                secretKeyRef:
                  name: mercel-runtime
                  key: WORKBENCH_USER
            - name: WORKBENCH_PASS
              valueFrom:
                secretKeyRef:
                  name: mercel-runtime
                  key: WORKBENCH_PASS
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: mercel-runtime
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: mercel-runtime
                  key: AWS_SECRET_ACCESS_KEY
            - name: S3_ENDPOINT
              value: http://rustfs.rustfs.svc.cluster.local:9000
            - name: S3_BUCKET
              value: mercel
            - name: AWS_REGION
              value: us-east-1
            - name: PORT
              value: "3000"
          ports:
            - name: http
              containerPort: 3000
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /
              port: http
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 1Gi
            limits:
              memory: 1Gi
              ephemeral-storage: 6Gi
          volumeMounts:
            - name: output
              mountPath: /app/apps/upload-server/output
      volumes:
        - name: output
          emptyDir:
            sizeLimit: 5Gi

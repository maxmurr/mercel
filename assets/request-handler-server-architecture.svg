<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="260" viewBox="0 0 1260 260" role="img" aria-labelledby="title description" font-family="Helvetica, Arial, sans-serif">
  <title id="title">Request handler · :3001</title>
  <desc id="description">The request handler receives a site request, resolves its hostname and path, fetches built assets from S3-compatible storage, and streams the site to the browser. It does not query Postgres or Redis.</desc>

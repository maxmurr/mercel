services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      # Local development credentials only. Override with --env-file .env.compose.
      POSTGRES_DB: ${POSTGRES_DB:-mercel}
      POSTGRES_USER: ${POSTGRES_USER:-mercel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mercel-local-secret}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rustfs:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    command: ["/data"]
    environment:
      # Local development credentials only. Override with --env-file .env.compose.
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-mercel-local}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-mercel-local-secret}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres-data:
  redis-data:
  rustfs-data:
